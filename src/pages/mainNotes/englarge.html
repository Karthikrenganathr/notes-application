<div class="enlarged">
    <div class="enlarged__note">
        <div>
            <div class="enlarged__note__heading" contenteditable="true" data-isClicked="false" onclick="editClick(this)">
            </div>
            <div class="enlarged__note__imgcontainer">
                <img src='./img/note/pin.svg'  alt="pin image" class="enlarged__note__imgcontainer__img">
            </div>
        </div>
        <div class="enlarged__note__mainnote" data-isClicked="false" onclick="editClick(this)">
        </div>
        <div class="enlarged__note__options">
            <div class="enlarged__note__options__option">
                <img src="./img/note/notification.svg" alt="alert image" class="enlarged__note__options__option__img start">
                <img src="./img/note/contact.svg" alt="alert image" class="enlarged__note__options__option__img">
                <img src="./img/note/themes.svg" alt="alert image" class="enlarged__note__options__option__img">
                <img src="./img/note/photo.svg" alt="alert image" class="enlarged__note__options__option__img">
                <img src="./img/note/archive.svg" alt="alert image" class="enlarged__note__options__option__img">
                <img src="./img/note/more.svg" alt="alert image" class="enlarged__note__options__option__img">
            </div>
            <div class="enlarged__note__options__close">
                close
            </div>
        </div>
    </div>
</div>
